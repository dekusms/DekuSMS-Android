pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.google.devtools.ksp' version '2.3.6'
        id 'org.jetbrains.kotlin.android' version '2.3.10'
        id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.10'
        id 'org.jetbrains.kotlin.plugin.compose' version '2.3.10'
